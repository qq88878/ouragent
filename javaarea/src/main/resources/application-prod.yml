spring:
  datasource:
    url: jdbc:mysql://${DB_HOST:mysql}:3306/edu_agent?useUnicode=true&characterEncoding=utf-8&serverTimezone=Asia/Shanghai
    username: ${DB_USER:edu_agent}
    password: ${DB_PASSWORD:}
    driver-class-name: com.mysql.cj.jdbc.Driver
  redis:
    host: ${REDIS_HOST:redis}
    port: 6379
    password: ${REDIS_PASSWORD:}
    database: 0

agent:
  service:
    url: ${AGENT_SERVICE_URL:http://agent-service:8000}
    timeout: ${AGENT_TIMEOUT:10000}
    retry:
      max-attempts: 3
      delay: 1000

logging:
  level:
    com.edu.agent: INFO

file:
  upload:
    path: /data/uploads
    allowed-types: pdf,docx,md,txt
