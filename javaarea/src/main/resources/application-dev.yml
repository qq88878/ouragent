spring:
  datasource:
    url: jdbc:mysql://localhost:3306/edu_agent?useUnicode=true&characterEncoding=utf-8&serverTimezone=Asia/Shanghai
    username: root
    password: root
    driver-class-name: com.mysql.cj.jdbc.Driver
  redis:
    host: localhost
    port: 6379
    database: 0

agent:
  service:
    url: http://localhost:8000
    timeout: 10000
    retry:
      max-attempts: 3
      delay: 1000

logging:
  level:
    com.edu.agent: DEBUG

file:
  upload:
    path: ./uploads
    allowed-types: pdf,docx,md,txt
