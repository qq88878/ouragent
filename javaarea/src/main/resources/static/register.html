<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>注册 - EduAgent</title>
    <style>
        /* ... [与登录页相同的样式] ... */
        body, html {
            margin: 0;
            padding: 0;
            height: 100%;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
            background-image: url('https://images.unsplash.com/photo-1518770660439-4636190af475?q=80&w=2070&auto=format&fit=crop');
            background-size: cover;
            background-position: center;
            display: flex;
            justify-content: center;
            align-items: center;
        }
        .form-container {
            background: rgba(255, 255, 255, 0.9);
            padding: 40px;
            border-radius: 10px;
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.2);
            width: 100%;
            max-width: 400px;
            text-align: center;
        }
        h2 {
            margin-bottom: 30px;
            color: #333;
        }
        .form-group {
            margin-bottom: 20px;
            text-align: left;
        }
        label {
            display: block;
            margin-bottom: 8px;
            color: #555;
            font-weight: bold;
        }
        input {
            width: 100%;
            padding: 12px;
            box-sizing: border-box;
            border: 1px solid #ddd;
            border-radius: 5px;
            font-size: 16px;
        }
        button {
            width: 100%;
            padding: 12px;
            background-color: #28a745;
            color: white;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            font-size: 16px;
            font-weight: bold;
            transition: background-color: 0.3s;
        }
        button:hover {
            background-color: #218838;
        }
        .switch-link {
            margin-top: 20px;
            font-size: 14px;
        }
        .switch-link a {
            color: #007bff;
            text-decoration: none;
        }
        .switch-link a:hover {
            text-decoration: underline;
        }
        /* 新增的提示框样式 */
        .alert-box {
            margin-top: 20px;
            padding: 15px;
            border-radius: 5px;
            font-weight: bold;
            display: none; /* 默认隐藏 */
        }
        .alert-success {
            background-color: #d4edda;
            color: #155724;
            border: 1px solid #c3e6cb;
        }
        .alert-danger {
            background-color: #f8d7da;
            color: #721c24;
            border: 1px solid #f5c6cb;
        }
    </style>
</head>
<body>

<div class="form-container">
    <h2>创建新账户</h2>
    <form id="registerForm">
        <div class="form-group">
            <label for="reg-username">用户名</label>
            <input type="text" id="reg-username" required>
        </div>
        <div class="form-group">
            <label for="reg-email">邮箱</label>
            <input type="email" id="reg-email" required>
        </div>
        <div class="form-group">
            <label for="reg-password">密码</label>
            <input type="password" id="reg-password" required>
        </div>
        <button type="submit">注 册</button>
    </form>
    <div class="switch-link">
        已有账户？ <a href="index.html">点击登录</a>
    </div>
    <!-- 新的提示框 -->
    <div id="alert-message" class="alert-box"></div>
</div>

<script>
    const alertBox = document.getElementById('alert-message');

    function showAlert(message, type) {
        alertBox.textContent = message;
        alertBox.className = `alert-box alert-${type}`;
        alertBox.style.display = 'block';
    }

    document.getElementById('registerForm').addEventListener('submit', async function (e) {
        e.preventDefault();
        alertBox.style.display = 'none';

        const username = document.getElementById('reg-username').value;
        const email = document.getElementById('reg-email').value;
        const password = document.getElementById('reg-password').value;

        try {
            const response = await fetch('/api/auth/register', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ username, email, password })
            });
            const result = await response.json();

            if (result.code === 200) {
                showAlert('注册成功！现在您可以去登录了。', 'success');
            } else {
                showAlert(result.message || '发生未知错误', 'danger');
            }
        } catch (error) {
            showAlert('请求错误: 无法连接到服务器或网络异常。', 'danger');
        }
    });
</script>

</body>
</html>
