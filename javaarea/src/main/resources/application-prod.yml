spring:
  datasource:
    url: jdbc:mysql://${DB_HOST:mysql}:3306/edu_agent?useUnicode=true&characterEncoding=utf-8&serverTimezone=Asia/Shanghai&useSSL=false&allowPublicKeyRetrieval=true&connectTimeout=10000
    username: ${DB_USER:root}
    password: ${DB_PASSWORD:zbq060423...}
    driver-class-name: com.mysql.cj.jdbc.Driver
  data:
    redis:
      host: ${REDIS_HOST:redis}
      port: 6379
      database: 0
  mail:
    host: ${MAIL_HOST:smtp.qq.com}
    port: ${MAIL_PORT:587}
    username: ${MAIL_USERNAME:}
    password: ${MAIL_PASSWORD:}
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true

agent:
  service:
    url: ${AGENT_SERVICE_URL:http://agent-service:8000}
    key: ${AGENT_SERVICE_KEY:default-dev-key}
    timeout: ${AGENT_TIMEOUT:10000}
    retry:
      max-attempts: 3
      delay: 1000

logging:
  level:
    com.edu.agent: INFO

file:
  upload:
    path: /data/uploads
    allowed-types: pdf,docx,md,txt

app:
  base-url: ${APP_BASE_URL:http://localhost}
  cors:
    allowed-origins: http://localhost:8080,https://your-production-domain.com