# ============================================================
# Docker Compose — 教育系统完整服务编排
# Java后端 + Python Agent + Vue前端(Nginx) + MySQL + PostgreSQL + Redis
#
# 使用前先构建前端:
#   cd frontend && npm install && npm run build
# 然后:
#   docker-compose up -d
# ============================================================

services:

  # ==================== Nginx 反向代理 + Vue 前端 ====================
  nginx:
    image: nginx:alpine
    container_name: edu-nginx
    ports:
      - "8080:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./frontend/dist:/usr/share/nginx/html:ro
    depends_on:
      - java-backend
      - agent-service
    restart: unless-stopped
    networks:
      - edu-network

  # ==================== Java 教育系统后端 ====================
  java-backend:
    build:
      context: ./javaarea
      dockerfile: Dockerfile
    container_name: java-backend
    ports:
      - "9001:9000"
    environment:
      - SPRING_PROFILES_ACTIVE=prod
      - JAVA_OPTS=-Xms256m -Xmx512m -Djava.net.preferIPv4Stack=true
      - DB_HOST=mysql
      - DB_USER=edu_agent
      - DB_PASSWORD=edu_agent_password
      - REDIS_HOST=redis
      - REDIS_PASSWORD=
      - AGENT_SERVICE_URL=http://agent-service:8000
      - AGENT_SERVICE_KEY=internal-agent-key-2024
      - AGENT_TIMEOUT=10000
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
      agent-service:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "-X", "POST", "-H", "Content-Type: application/json", "-d", '{"username":"health","password":"check"}', "http://localhost:9000/api/auth/login"]
      interval: 30s
      timeout: 10s
      start_period: 40s
      retries: 3
    restart: unless-stopped
    networks:
      - edu-network

  # ==================== Python Agent 服务 ====================
  agent-service:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: agent-service
    ports:
      - "8001:8000"
    environment:
      - APP_ENV=production
      - DEBUG=false
      - LOG_LEVEL=INFO
      - PORT=8000
      - DB_HOST=mysql
      - DB_PORT=3306
      - DB_NAME=agent_db
      - DB_USER=agent
      - DB_PASSWORD=agent_password
      - DB_POOL_SIZE=10
      - DB_MAX_OVERFLOW=20
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - REDIS_PASSWORD=
      - SECRET_KEY=your-secret-key-change-in-production
      - AGENT_SERVICE_KEY=internal-agent-key-2024
      - CORS_ORIGINS=http://localhost:3000,http://localhost:8080
    volumes:
      - agent-uploads:/app/uploads
      - agent-logs:/app/logs
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      start_period: 15s
      retries: 3
    restart: unless-stopped
    networks:
      - edu-network

  # ==================== MySQL 数据库 (Java端 + Python Agent) ====================
  mysql:
    image: mysql:8.0
    container_name: edu-mysql
    environment:
      MYSQL_ROOT_PASSWORD: root_password
      MYSQL_DATABASE: edu_agent
      MYSQL_USER: edu_agent
      MYSQL_PASSWORD: edu_agent_password
    ports:
      - "3308:3306"
    volumes:
      - mysql-data:/var/lib/mysql
      - ./javaarea/src/main/resources/db/schema.sql:/docker-entrypoint-initdb.d/01-schema.sql:ro
      - ./v3/config/mysql-init.sql:/docker-entrypoint-initdb.d/02-agent.sql:ro
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-proot_password"]
      interval: 10s
      timeout: 5s
      start_period: 30s
      retries: 5
    restart: unless-stopped
    networks:
      - edu-network

  # ==================== Redis 缓存 (共享) ====================
  redis:
    image: redis:7-alpine
    container_name: edu-redis
    ports:
      - "6380:6379"
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 3
    restart: unless-stopped
    networks:
      - edu-network

volumes:
  mysql-data:
  redis-data:
  agent-uploads:
  agent-logs:

networks:
  edu-network:
    driver: bridge