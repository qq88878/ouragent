"""
gRPC服务定义
提供高性能的RPC接口供Java调用
"""

# 这是protobuf定义文件，需要编译
# 运行: python -m grpc_tools.protoc -I. --python_out=. --grpc_python_out=. agent.proto

"""
syntax = "proto3";

package agent;

service AgentService {
  // 对话接口
  rpc Chat (ChatRequest) returns (ChatResponse);

  // 工具调用
  rpc CallTool (ToolRequest) returns (ToolResponse);

  // 获取状态
  rpc GetStatus (Empty) returns (AgentStatus);

  // 获取工具列表
  rpc ListTools (Empty) returns (ToolList);

  // 清除记忆
  rpc ClearMemory (Empty) returns (Empty);
}

message Empty {}

message ChatRequest {
  string message = 1;
  map<string, string> context = 2;
  string user_id = 3;
}

message ChatResponse {
  string response = 1;
  string agent_id = 2;
  string status = 3;
}

message ToolRequest {
  string tool_name = 1;
  map<string, string> parameters = 2;
}

message ToolResponse {
  string result = 1;
  string tool_name = 2;
  string status = 3;
}

message AgentStatus {
  string id = 1;
  string name = 2;
  string description = 3;
  repeated string available_tools = 4;
  int32 memory_size = 5;
}

message ToolList {
  repeated string tools = 1;
}
"""
