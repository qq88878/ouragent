<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>登录 - EduAgent</title>
    <style>
        /* ... [之前的样式保持不变] ... */
        body, html {
            margin: 0;
            padding: 0;
            height: 100%;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
            background-image: url('https://images.unsplash.com/photo-1518770660439-4636190af475?q=80&w=2070&auto=format&fit=crop');
            background-size: cover;
            background-position: center;
            display: flex;
            justify-content: center;
            align-items: center;
        }
        .form-container {
            background: rgba(255, 255, 255, 0.9);
            padding: 40px;
            border-radius: 10px;
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.2);
            width: 100%;
            max-width: 400px;
            text-align: center;
        }
        h2 {
            margin-bottom: 30px;
            color: #333;
        }
        .form-group {
            margin-bottom: 20px;
            text-align: left;
        }
        label {
            display: block;
            margin-bottom: 8px;
            color: #555;
            font-weight: bold;
        }
        input {
            width: 100%;
            padding: 12px;
            box-sizing: border-box;
            border: 1px solid #ddd;
            border-radius: 5px;
            font-size: 16px;
        }
        button {
            width: 100%;
            padding: 12px;
            background-color: #007bff;
            color: white;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            font-size: 16px;
            font-weight: bold;
            transition: background-color: 0.3s;
        }
        button:hover {
            background-color: #0056b3;
        }
        .switch-link {
            margin-top: 20px;
            font-size: 14px;
        }
        .switch-link a {
            color: #007bff;
            text-decoration: none;
        }
        .switch-link a:hover {
            text-decoration: underline;
        }
        /* 新增的提示框样式 */
        .alert-box {
            margin-top: 20px;
            padding: 15px;
            border-radius: 5px;
            font-weight: bold;
            display: none; /* 默认隐藏 */
        }
        .alert-success {
            background-color: #d4edda;
            color: #155724;
            border: 1px solid #c3e6cb;
        }
        .alert-danger {
            background-color: #f8d7da;
            color: #721c24;
            border: 1px solid #f5c6cb;
        }
    </style>
</head>
<body>

<div class="form-container">
    <h2>用户登录</h2>
    <form id="loginForm">
        <div class="form-group">
            <label for="login-username">用户名</label>
            <input type="text" id="login-username" required>
        </div>
        <div class="form-group">
            <label for="login-password">密码</label>
            <input type="password" id="login-password" required>
        </div>
        <button type="submit">登 录</button>
    </form>
    <div class="switch-link">
        没有账户？ <a href="register.html">点击注册</a>
    </div>
    <!-- 新的提示框 -->
    <div id="alert-message" class="alert-box"></div>
</div>

<script>
    const alertBox = document.getElementById('alert-message');

    function showAlert(message, type) {
        alertBox.textContent = message;
        alertBox.className = `alert-box alert-${type}`; // 'alert-success' or 'alert-danger'
        alertBox.style.display = 'block';
    }

    document.getElementById('loginForm').addEventListener('submit', async function (e) {
        e.preventDefault();
        alertBox.style.display = 'none'; // 先隐藏旧的提示

        const username = document.getElementById('login-username').value;
        const password = document.getElementById('login-password').value;

        try {
            const response = await fetch('/api/auth/login', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ username, password })
            });
            const result = await response.json();

            if (result.code === 200) {
                showAlert('登录成功！正在跳转...', 'success');
                // 可以在这里保存 token 并跳转到用户主页
                // 例如: localStorage.setItem('accessToken', result.data.accessToken);
                // setTimeout(() => window.location.href = '/dashboard.html', 1500);
            } else {
                showAlert(result.message || '发生未知错误', 'danger');
            }
        } catch (error) {
            showAlert('请求错误: 无法连接到服务器或网络异常。', 'danger');
        }
    });
</script>

</body>
</html>
