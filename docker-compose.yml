# ============================================================
# Docker Compose - education system service orchestration
# Java backend + Python Agent + Vue frontend (Nginx) + MySQL + Redis
#
# Build frontend first:
#   cd frontend && npm install && npm run build
# Then:
#   docker-compose up -d
# ============================================================

services:

  # ==================== Nginx reverse proxy + Vue frontend ====================
  nginx:
    image: nginx:alpine
    container_name: edu-nginx
    ports:
      - "8080:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./frontend/dist:/usr/share/nginx/html:ro
    depends_on:
      - java-backend
      - agent-service
    restart: unless-stopped
    networks:
      - edu-network

  # ==================== Java education system backend ====================
  java-backend:
    build:
      context: ./javaarea
      dockerfile: Dockerfile
    container_name: java-backend
    ports:
      - "9001:9000"
    environment:
      - SPRING_PROFILES_ACTIVE=prod
      - SPRING_DATASOURCE_URL=jdbc:mysql://mysql:3306/edu_agent?useUnicode=true&characterEncoding=utf-8&serverTimezone=Asia/Shanghai&useSSL=false&allowPublicKeyRetrieval=true&connectTimeout=10000
      - JAVA_OPTS=${JAVA_OPTS:--Xms256m -Xmx512m -Djava.net.preferIPv4Stack=true}
      - DB_HOST=mysql
      - DB_NAME=${DB_NAME:-edu_agent}
      - DB_USER=root
      - DB_PASSWORD=${MYSQL_ROOT_PASSWORD}
      - REDIS_HOST=redis
      - REDIS_PASSWORD=
      - AGENT_SERVICE_URL=http://agent-service:8000
      - AGENT_SERVICE_KEY=${AGENT_SERVICE_KEY:-internal-agent-key-2024}
      - AGENT_TIMEOUT=${AGENT_TIMEOUT:-120000}
      - JWT_SECRET=${JWT_SECRET:-change-this-in-production}
    volumes:
      - java-uploads:/data/uploads
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
      agent-service:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "-X", "POST", "-H", "Content-Type: application/json", "-d", '{"username":"health","password":"check"}', "http://localhost:9000/api/auth/login"]
      interval: 30s
      timeout: 10s
      start_period: 40s
      retries: 3
    restart: unless-stopped
    networks:
      - edu-network

  # ==================== Python Agent service ====================
  agent-service:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: agent-service
    ports:
      - "8001:8000"
    environment:
      - APP_ENV=${APP_ENV:-production}
      - DEBUG=${DEBUG:-false}
      - LOG_LEVEL=${LOG_LEVEL:-INFO}
      - PORT=8000
      - DB_HOST=mysql
      - DB_PORT=3306
      - DB_NAME=${DB_NAME:-edu_agent}
      - DB_USER=root
      - DB_PASSWORD=${MYSQL_ROOT_PASSWORD}
      - DB_POOL_SIZE=${DB_POOL_SIZE:-10}
      - DB_MAX_OVERFLOW=${DB_MAX_OVERFLOW:-20}
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - REDIS_PASSWORD=
      - SECRET_KEY=${SECRET_KEY:-change-this-in-production}
      - JWT_SECRET=${JWT_SECRET:-change-this-in-production}
      - AGENT_SERVICE_KEY=${AGENT_SERVICE_KEY:-internal-agent-key-2024}
      - CORS_ORIGINS=http://localhost:3000,http://localhost:8080
      - LLM_PROVIDER=${LLM_PROVIDER:-openai}
      - LLM_API_KEY=${LLM_API_KEY:-sk-ctbyrzyntjxtbva441lzdqawmxboaqru7q03acd6euo2q3q1}
      - LLM_BASE_URL=${LLM_BASE_URL:-https://api.xiaomimimo.com/v1}
      - LLM_MODEL=${LLM_MODEL:-mimo-v2.5-pro}
      - EMBEDDING_API_KEY=${EMBEDDING_API_KEY:-tp-c4ksz64wen9n5g0pbqjw34nfghupg0suks538m24snl8d61u}
      - EMBEDDING_BASE_URL=${EMBEDDING_BASE_URL:-https://token-plan-cn.xiaomimimo.com/v1}
      - EMBEDDING_MODEL=${EMBEDDING_MODEL:-text-embedding-3-small}
    volumes:
      - agent-uploads:/app/uploads
      - agent-logs:/app/logs
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      start_period: 15s
      retries: 3
    restart: unless-stopped
    networks:
      - edu-network

  # ==================== MySQL database (shared) ====================
  mysql:
    image: mysql:8.0
    container_name: edu-mysql
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      MYSQL_DATABASE: ${MYSQL_DATABASE:-edu_agent}
    ports:
      - "3308:3306"
    volumes:
      - mysql-data:/var/lib/mysql
      - ./javaarea/src/main/resources/db/schema.sql:/docker-entrypoint-initdb.d/01-schema.sql:ro
      - ./v3/config/mysql-init.sql:/docker-entrypoint-initdb.d/02-agent.sql:ro
      - ./javaarea/src/main/resources/db/seed.sql:/docker-entrypoint-initdb.d/03-seed.sql:ro
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-p${MYSQL_ROOT_PASSWORD}"]
      interval: 10s
      timeout: 5s
      start_period: 30s
      retries: 5
    restart: unless-stopped
    networks:
      - edu-network

  # ==================== Redis cache (shared) ====================
  redis:
    image: redis:7-alpine
    container_name: edu-redis
    ports:
      - "6380:6379"
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 3
    restart: unless-stopped
    networks:
      - edu-network

volumes:
  mysql-data:
  java-uploads:
  redis-data:
  agent-uploads:
  agent-logs:

networks:
  edu-network:
    driver: bridge
