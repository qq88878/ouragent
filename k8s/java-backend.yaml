apiVersion: apps/v1
kind: Deployment
metadata:
  name: java-backend
  namespace: edu-agent
  labels:
    app: java-backend
spec:
  replicas: 1
  selector:
    matchLabels:
      app: java-backend
  template:
    metadata:
      labels:
        app: java-backend
    spec:
      containers:
        - name: java-backend
          image: ouragent-java-backend:latest
          imagePullPolicy: Never
          ports:
            - containerPort: 9000
          envFrom:
            - configMapRef:
                name: edu-config
            - secretRef:
                name: edu-secrets
          env:
            - name: DB_HOST
              value: mysql
            - name: REDIS_HOST
              value: redis
          readinessProbe:
            httpGet:
              path: /api/auth/me
              port: 9000
            initialDelaySeconds: 40
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /api/auth/me
              port: 9000
            initialDelaySeconds: 60
            periodSeconds: 30
          resources:
            requests:
              memory: "512Mi"
              cpu: "500m"
            limits:
              memory: "1Gi"
              cpu: "1000m"
---
apiVersion: v1
kind: Service
metadata:
  name: java-backend
  namespace: edu-agent
spec:
  selector:
    app: java-backend
  ports:
    - port: 9000
      targetPort: 9000
  type: ClusterIP
