# Docker Compose配置
# 教育系统完整服务编排: Java后端 + Python Agent + 数据库 + 缓存 + 向量数据库 + 反向代理

services:

  # ==================== Nginx反向代理 ====================
  nginx:
    image: nginx:alpine
    container_name: edu-nginx
    ports:
      - "80:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - java-backend
      - agent-service
    restart: unless-stopped
    networks:
      - edu-network

  # ==================== Java教育系统后端 ====================
  java-backend:
    build:
      context: ./javaarea
      dockerfile: Dockerfile
    container_name: java-backend
    ports:
      - "9000:9000"
    environment:
      - SPRING_PROFILES_ACTIVE=prod
      - JAVA_OPTS=-Xms256m -Xmx512m
      # 数据库
      - DB_HOST=mysql
      - DB_USER=edu_agent
      - DB_PASSWORD=edu_agent_password
      # Redis
      - REDIS_HOST=redis
      - REDIS_PASSWORD=
      # Agent服务
      - AGENT_SERVICE_URL=http://agent-service:8000
      - AGENT_TIMEOUT=10000
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
      agent-service:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/api/auth/me"]
      interval: 30s
      timeout: 10s
      start_period: 40s
      retries: 3
    restart: unless-stopped
    networks:
      - edu-network

  # ==================== Python Agent服务 ====================
  agent-service:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: agent-service
    ports:
      - "8000:8000"
    environment:
      - APP_ENV=production
      - DEBUG=false
      - LOG_LEVEL=INFO
      - PORT=8000
      # PostgreSQL配置
      - DB_HOST=postgres
      - DB_PORT=5432
      - DB_NAME=agent_db
      - DB_USER=agent
      - DB_PASSWORD=agent_password
      - DB_POOL_SIZE=10
      - DB_MAX_OVERFLOW=20
      # Redis配置
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - REDIS_PASSWORD=
      # Milvus配置
      - MILVUS_HOST=milvus
      - MILVUS_PORT=19530
      # 安全配置
      - SECRET_KEY=your-secret-key-change-in-production
      # CORS配置
      - CORS_ORIGINS=http://localhost:3000,http://localhost:8080
    volumes:
      - agent-uploads:/app/uploads
      - agent-logs:/app/logs
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      milvus:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      start_period: 15s
      retries: 3
    restart: unless-stopped
    networks:
      - edu-network

  # ==================== MySQL数据库 (Java端) ====================
  mysql:
    image: mysql:8.0
    container_name: edu-mysql
    environment:
      MYSQL_ROOT_PASSWORD: root_password
      MYSQL_DATABASE: edu_agent
      MYSQL_USER: edu_agent
      MYSQL_PASSWORD: edu_agent_password
    ports:
      - "3306:3306"
    volumes:
      - mysql-data:/var/lib/mysql
      - ./javaarea/src/main/resources/db/schema.sql:/docker-entrypoint-initdb.d/01-schema.sql:ro
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-proot_password"]
      interval: 10s
      timeout: 5s
      start_period: 30s
      retries: 5
    restart: unless-stopped
    networks:
      - edu-network

  # ==================== PostgreSQL数据库 (Agent端) ====================
  postgres:
    image: postgres:15-alpine
    container_name: agent-postgres
    environment:
      POSTGRES_DB: agent_db
      POSTGRES_USER: agent
      POSTGRES_PASSWORD: agent_password
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U agent -d agent_db"]
      interval: 10s
      timeout: 5s
      retries: 3
    restart: unless-stopped
    networks:
      - edu-network

  # ==================== Redis缓存 (共享) ====================
  redis:
    image: redis:7-alpine
    container_name: edu-redis
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 3
    restart: unless-stopped
    networks:
      - edu-network

  # ==================== Milvus向量数据库 ====================
  milvus:
    image: milvusdb/milvus:v2.4.0
    container_name: milvus-standalone
    command: ["milvus", "run", "standalone"]
    environment:
      ETCD_USE_EMBED: "true"
      ETCD_DATA_DIR: /var/lib/milvus/etcd
      COMMON_STORAGETYPE: local
    ports:
      - "19530:19530"
      - "9091:9091"
    volumes:
      - milvus-data:/var/lib/milvus
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9091/healthz"]
      interval: 10s
      timeout: 10s
      start_period: 30s
      retries: 5
    restart: unless-stopped
    networks:
      - edu-network

# ==================== 卷定义 ====================
volumes:
  mysql-data:
  postgres-data:
  redis-data:
  milvus-data:
  agent-uploads:
  agent-logs:

# ==================== 网络定义 ====================
networks:
  edu-network:
    driver: bridge
