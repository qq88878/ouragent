# ===================================================================
# Spring Boot Application Configuration
# ===================================================================

# Server Configuration
# The port on which your application will run. This was defined as 9000 in your Dockerfile.
server.port=9000

# Context path for the application. All endpoints will be prefixed with /api.
server.servlet.context-path=/api

# ===================================================================
# DATASOURCE CONFIGURATION
# -------------------------------------------------------------------
# Replace with your actual database connection details.
# It's recommended to use environment variables for sensitive data in production.
# ===================================================================
spring.datasource.url=jdbc:mysql://127.0.0.1:3306/edu_agent_db?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai
spring.datasource.username=root
spring.datasource.password=123456
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# ===================================================================
# MYBATIS-PLUS CONFIGURATION
# ===================================================================
# Location of MyBatis mapper XML files
mybatis-plus.mapper-locations=classpath*:/mapper/**/*.xml

# Enable mapping from snake_case in database to camelCase in Java objects
mybatis-plus.configuration.map-underscore-to-camel-case=true

# Global configuration for logical deletion
mybatis-plus.global-config.db-config.logic-delete-field=deleted # Logical delete field name (global)
mybatis-plus.global-config.db-config.logic-not-delete-value=0 # Value for 'not deleted'
mybatis-plus.global-config.db-config.logic-delete-value=1 # Value for 'deleted'

# ===================================================================
# SPRING PROFILES
# ===================================================================
# Set the default active profile. Can be 'dev', 'prod', 'test', etc.
# This allows you to have different configuration files like 'application-dev.properties'.
spring.profiles.active=dev